# 信号阈值配置 - 信号汇总器用这个判断"操作建议"
indicators:
  rsi:
    overbought: 70
    oversold: 30
    extreme_overbought: 80
    extreme_oversold: 20

  macd:
    enabled: true

  bollinger:
    period: 20
    std: 2

  ma:
    short: 20
    medium: 50
    long: 200

  atr:
    period: 14

# 信号 → 操作建议的映射
action_rules:
  # 加仓信号（多个条件加权打分）
  buy:
    require_any:
      - "macd_cross_up_above_zero"
      - "break_ma200_with_volume"
      - "rsi_oversold_reversal"
    require_all_filters:
      - "above_ma50"            # 不在主下跌趋势中

  # 减仓信号
  reduce:
    require_any:
      - "rsi_extreme_overbought"
      - "break_bb_upper"
      - "macd_cross_down_below_zero"

  # 止损（强制建议）
  stop_loss:
    pnl_pct: -0.15
    or_breach_ma200: true       # 跌破 200 日线也触发

  # 止盈（柔性建议）
  take_profit:
    pnl_pct: 0.30
    or_rsi_above: 80

# ---- multi_factor 动作阈值 (C9, 2026-09-10) ----
# 改这里即可调参, 不用动代码。改完请跑:
#   ./venv/bin/python -m quant.calibration        # 看 composite 的实际预测力
#   ./venv/bin/python -m quant.threshold_report   # 看新阈值在历史上的触发情况
multi_factor:
  # 原 0.30 —— 4 个月仅触发 3 次。threshold_report 的 min-of-segments 口径给出 0.10
  # (各段价差 6.61/14.19), 0.12 是 6.52/21.46 —— 在 ~40 个重叠样本上两者差异属噪音。
  # 取更保守的 0.12: 这是一个会真的开始发买入建议的开关, 宁可少发。
  # 攒满一个季度后重跑 `python -m quant.threshold_report --split <date>` 再定。
  add_threshold: 0.12
  watch_buy_threshold: 0.06
  reduce_threshold: -0.12
  watch_skip_threshold: -0.06
  max_adds_per_day: 3          # 横截面闸门: 同日 ADD 上限 (截面 IC 有效, 时序 IC ≈0)

# ---- 回测宇宙 (2026-09-10) ----
# portfolio = 只回测持仓+关注 (16 只, 旧行为 —— 网格已于 2026-09-01 穷举完, daemon 空转)
# full      = 全部有本地价格的标的 (157 只)
backtest:
  universe_mode: full
